[project]
name = "permissions-server"
version = "0.1.0"
description = "Permissions/access-control server for maps & layers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "adfs-auth @ file:///C:/Users/Eitam/adfs-auth",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["permissions_server"]
# These files only execute meaningfully against a real Postgres connection
# (actual SQL execution, the ltree TypeDecorator's bind/result processors,
# asyncpg engine/session construction) — tests/conftest.py deliberately keeps
# the suite hermetic/in-memory (PERMISSIONS_DATABASE_URL force-unset), so
# there is no way to exercise these lines without a live database. Covered
# instead by the db-migration-smoke CI job's `alembic upgrade head` against a
# real Postgres service container (see CI plan) plus manual DB-mode testing
# (CLAUDE.md's "Running the app" section) — not by this hermetic suite.
omit = [
    "*/infrastructure/repositories/sqlalchemy_*.py",
    "*/infrastructure/repositories/_pagination.py",
    "*/infrastructure/db/session.py",
    "*/infrastructure/db/types.py",
]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "^\\s*\\.\\.\\.$",  # Protocol method bodies
    "if TYPE_CHECKING:",
]
