[project]
name = "permissions-server"
version = "0.1.0"
description = "Permissions/access-control server for maps & layers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "adfs-auth @ file:///C:/Users/Eitam/adfs-auth",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: requires PERMISSIONS_TEST_DATABASE_URL and a real Postgres instance; skipped otherwise (see tests/db/conftest.py, DATABASE.md)",
]

[tool.coverage.run]
source = ["permissions_server"]
# These files only execute meaningfully against a real Postgres connection
# (actual SQL execution, the ltree TypeDecorator's bind/result processors,
# asyncpg engine/session construction) — tests/conftest.py deliberately keeps
# the *hermetic* suite (this coverage gate) in-memory (PERMISSIONS_DATABASE_URL
# force-unset), so there is no way to exercise these lines under that gate.
# They ARE covered, just not by this gate: tests/db/ (PERMISSIONS_TEST_DATABASE_URL,
# a separate opt-in tier — see DATABASE.md's "DB-backed test tier") runs
# `alembic upgrade head` and every SQLAlchemy repository against a real
# Postgres. Kept out of `omit`'s reasoning above regardless — folding tests/db
# into this 100%-fail_under gate would make the hermetic suite non-hermetic
# (it would require Postgres to pass `pytest --cov`), which is the exact
# thing tests/conftest.py's force-unset exists to prevent.
omit = [
    "*/infrastructure/repositories/sqlalchemy_*.py",
    "*/infrastructure/repositories/_pagination.py",
    "*/infrastructure/db/session.py",
    "*/infrastructure/db/types.py",
]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "^\\s*\\.\\.\\.$",  # Protocol method bodies
    "if TYPE_CHECKING:",
]
